; ============================================================================
; PlatformIO Project Configuration File
; Proyek: IoT Monitoring Kualitas Udara & Sirkulasi Ruangan (ESP32)
; ============================================================================
; Cara memilih program yang ingin di-compile / upload di VS Code PlatformIO:
; 1. Klik ikon "Switch PlatformIO Project Environment" di Status Bar bawah VS Code
;    (secara default terpilih: env:esp32_revisi)
; 2. Pilih environment sesuai sketch yang ingin dijalankan
; 3. Klik tombol Build (centang) atau Upload (panah kanan)
; ============================================================================

[platformio]
default_envs = esp32_revisi
src_dir = src

; Konfigurasi dasar bersama untuk semua sketch ESP32
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, default
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SGP30 Sensor @ ^2.0.3
    beegee-tokyo/DHTesp @ ^1.19

; ============================================================================
; 1. FIRMWARE UTAMA (DEFAULT)
; ============================================================================
[env:esp32_revisi]
build_src_filter = -<*> +<main/ESP32_revisi.cpp>

; ============================================================================
; 2. VARIAN FIRMWARE GABUNGAN & MQTT
; ============================================================================
[env:esp32_mqtt_test1]
build_src_filter = -<*> +<variants/ESP32_mqtt_test1.cpp>

[env:esp32_monitoring_gabungan_v2]
build_src_filter = -<*> +<variants/ESP32_Monitoring_Gabungan_v2.cpp>

[env:esp32_monitoring_kipas_on]
build_src_filter = -<*> +<variants/ESP32_Monitoring_Kipas_On.cpp>

[env:esp32_monitoring_merged]
build_src_filter = -<*> +<variants/ESP32_Monitoring_Merged.cpp>

; ============================================================================
; 3. SKETCH PENGUJIAN MODULAR (TESTING)
; ============================================================================
[env:test0_esp32_board]
build_src_filter = -<*> +<tests/test0_esp32_board.cpp>

[env:test0_esp32_board_active]
build_src_filter = -<*> +<tests/test0_esp32_board_active.cpp>

[env:test1_dht_only]
build_src_filter = -<*> +<tests/test1_dht_only.cpp>

[env:test1_1_dht22_pin4]
build_src_filter = -<*> +<tests/test1_1_dht22_pin4.cpp>

[env:test1_2_dht22_dhtesp]
build_src_filter = -<*> +<tests/test1_2_dht22_dhtesp.cpp>

[env:test2_sgp30_only]
build_src_filter = -<*> +<tests/test2_sgp30_only.cpp>

[env:test2_1_sgp30_default_pins]
build_src_filter = -<*> +<tests/test2_1_sgp30_default_pins.cpp>

[env:test3_anemometer_only]
build_src_filter = -<*> +<tests/test3_anemometer_only.cpp>

[env:test4_dht_sgp30]
build_src_filter = -<*> +<tests/test4_dht_sgp30.cpp>

[env:test5_dht_anemometer]
build_src_filter = -<*> +<tests/test5_dht_anemometer.cpp>

[env:test6_sgp30_anemometer]
build_src_filter = -<*> +<tests/test6_sgp30_anemometer.cpp>

[env:test7_all_sensors]
build_src_filter = -<*> +<tests/test7_all_sensors.cpp>

[env:test_led]
build_src_filter = -<*> +<tests/test_led.cpp>

[env:test_relay_input]
build_src_filter = -<*> +<tests/test_relay_input.cpp>

[env:test_relay_kipas]
build_src_filter = -<*> +<tests/test_relay_kipas.cpp>

[env:test_relay_kipas2]
build_src_filter = -<*> +<tests/test_relay_kipas2.cpp>

[env:test_relay_kipas3]
build_src_filter = -<*> +<tests/test_relay_kipas3.cpp>

[env:test_tanpa_koneksi]
build_src_filter = -<*> +<tests/test_tanpa_koneksi.cpp>

; Khusus pengujian DHT22 pada board ESP8266 (NodeMCU / Wemos D1 Mini)
[env:test_mcu_dht22_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_src_filter = -<*> +<tests/test_mcu_dht22_esp8266.cpp>
